openapi: 3.0.1
info:
  title: ExpertMicroservice
  version: v1.0
  description: ExpertMicroservice REST API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html

paths:
  /oecci/expert/collaborateurs:
    post:
      operationId: createCollabos
      description: Permet d'ajouter un nouveau collaborateur avec ses informations personnelles, son role et son statut.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollaboRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/CreateCollaboRequest'
      responses:
        '201':
          $ref: '#/components/responses/DataResult201'
      tags: ["Collaborateur"]

  /oecci/expert/collaborateurs/get:
    get:
      operationId: getCollaborateurs
      description: Liste complete des collaborateurs.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/nestedFields'
        - $ref: '#/components/parameters/nestedFieldsDepth'
      responses:
        '200':
          $ref: '#/components/responses/DataResult200'
      tags: ["Collaborateur"]

  /oecci/expert/collaborateurs/readallby/{collaboID}:
    get:
      operationId: getAllCollabos
      description: Recuperer la liste des collaborateurs pour un collaborateur
      parameters:
        - name: collaboID
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/nestedFields'
        - $ref: '#/components/parameters/nestedFieldsDepth'
      responses:
        '200':
          $ref: '#/components/responses/DataResult200'
      tags: ["Collaborateur"]

  /oecci/expert/collaborateurs/by-user/{liferayUserId}:
    get:
      operationId: getCollaborateurByUser
      description: Collaborateur par utilisateur Liferay
      parameters:
        - name: liferayUserId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/nestedFields'
        - $ref: '#/components/parameters/nestedFieldsDepth'
      responses:
        '200':
          $ref: '#/components/responses/DataResult200'
      tags: ["Collaborateur"]

  /oecci/expert/experts-comptables:
    post:
      operationId: createExpertComptable
      description: Permet de creer un expert comptable independant, sans rattachement a un cabinet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpert_Comptable'
          application/xml:
            schema:
              $ref: '#/components/schemas/CreateExpert_Comptable'
      responses:
        '201':
          $ref: '#/components/responses/DataResult201'
      tags: ["Expert_Comptable"]

  /oecci/expert/experts-comptables/update/{Expert_ComptableID}:
    post:
      operationId: updateExpertComptable
      description: Mettre à jour les infos d'un expert comptable
      parameters:
        - name: Expert_ComptableID
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateExpertRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/updateExpertRequest'
      responses:
        '201':
          $ref: '#/components/responses/DataResult201'
      tags: ["Expert_Comptable"]

  /oecci/expert/experts-comptables/validation/{Expert_ComptableID}:
    post:
      operationId: validateExpertComptable
      description: Valider ou invalider l'inscription d'un expert comptable
      parameters:
        - name: Expert_ComptableID
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatutRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/StatutRequest'
      responses:
        '201':
          $ref: '#/components/responses/DataResult201'
      tags: ["Expert_Comptable"]

  /oecci/expert/experts-comptables/load-visual/{Expert_ComptableID}:
    post:
      operationId: loadSignVisual
      description: Charger le visuel de signature d'un expert comptable
      parameters:
        - name: Expert_ComptableID
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadVisualRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/LoadVisualRequest'
      responses:
        '201':
          $ref: '#/components/responses/DataResult201'
      tags: ["Expert_Comptable"]

  /oecci/expert/experts-comptables/{Expert_ComptableId}:
    get:
      operationId: getExpertComptableById
      description: Expert comptable par ID
      parameters:
        - name: Expert_ComptableId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/nestedFields'
        - $ref: '#/components/parameters/nestedFieldsDepth'
      responses:
        '200':
          $ref: '#/components/responses/DataResult200'
      tags: ["Expert_Comptable"]

  /oecci/expert/by-categorie:
    get:
      operationId: getExpertComptablesByCategorie
      description: Experts comptables par categorie et/ou etat
      parameters:
        - name: categorie
          in: query
          schema:
            type: string
            enum: [cabinet, individuel]
        - name: etat
          in: query
          schema:
            type: string
            enum: [aTRAITER, sUSPENDU, ACTIF]
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/nestedFields'
        - $ref: '#/components/parameters/nestedFieldsDepth'
      responses:
        '200':
          $ref: '#/components/responses/DataResult200'
      tags: ["Expert_Comptable"]

  /oecci/expert:
    get:
      operationId: getExpertComptables
      description: Experts comptables - endpoint generique
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/nestedFields'
        - $ref: '#/components/parameters/nestedFieldsDepth'
      responses:
        '200':
          $ref: '#/components/responses/DataResult200'
      tags: ["Expert_Comptable"]

  /oecci/expert/wallet/reload:
    post:
      operationId: reloadWallet
      description: Permet de recharger le wallet d'un expert comptable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReloadWalletRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/ReloadWalletRequest'
      responses:
        '201':
          $ref: '#/components/responses/DataResult201'
      tags: ["Expert_Comptable"]

  /oecci/expert/transfert-client:
    post:
      operationId: createTransfertClient
      description: Permet de transferer un client d'un expert comptable a un autre.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateForwardRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/CreateForwardRequest'
      responses:
        '201':
          $ref: '#/components/responses/DataResult201'
      tags: ["Transfert_Client"]

  /oecci/expert/transfert-client/validation/{demandeTransfertID}:
    post:
      operationId: validateDemandeTransfertClient
      description: Valider ou invalider la demande de transfert d'un client
      parameters:
        - name: demandeTransfertID
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatutRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/StatutRequest'
      responses:
        '201':
          $ref: '#/components/responses/DataResult201'
      tags: ["Transfert_Client"]

  /oecci/expert/transfert-client/by-destinataire/{Expert_ComptableId}:
    get:
      operationId: getDemandesTransfertByDestinataire
      description: Demandes de transfert par expert destinataire
      parameters:
        - name: Expert_ComptableId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/nestedFields'
        - $ref: '#/components/parameters/nestedFieldsDepth'
      responses:
        '200':
          $ref: '#/components/responses/DataResult200'
      tags: ["Transfert_Client"]

  /oecci/expert/transfert-client/by-expediteur/{Expert_ComptableId}:
    get:
      operationId: getDemandesTransfertByExpediteur
      description: Demandes de transfert par expert expediteur
      parameters:
        - name: Expert_ComptableId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/nestedFields'
        - $ref: '#/components/parameters/nestedFieldsDepth'
      responses:
        '200':
          $ref: '#/components/responses/DataResult200'
      tags: ["Transfert_Client"]

  /oecci/expert/transfert-client/list:
    get:
      operationId: getDemandesTransfertClients
      description: Demandes de transfert - endpoint generique
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/nestedFields'
        - $ref: '#/components/parameters/nestedFieldsDepth'
      responses:
        '200':
          $ref: '#/components/responses/DataResult200'
      tags: ["Transfert_Client"]

  /oecci/expert/demande-visas/by-date:
    get:
      operationId: getDemandeVisasByDate
      description: Demandes de visa par plage de dates
      parameters:
        - name: dateDebut
          in: query
          schema:
            type: string
        - name: dateFin
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/nestedFields'
        - $ref: '#/components/parameters/nestedFieldsDepth'
      responses:
        '200':
          $ref: '#/components/responses/DataResult200'
      tags: ["Visa"]

  /oecci/expert/demande-visas/by-expert/{expertId}:
    get:
      operationId: getDemandeVisasByExpert
      description: Demandes de visa par expert comptable
      parameters:
        - name: expertId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/nestedFields'
        - $ref: '#/components/parameters/nestedFieldsDepth'
      responses:
        '200':
          $ref: '#/components/responses/DataResult200'
      tags: ["Visa"]

  /oecci/expert/demande-visas:
    get:
      operationId: getDemandeVisas
      description: Demandes de visa - endpoint generique
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/nestedFields'
        - $ref: '#/components/parameters/nestedFieldsDepth'
      responses:
        '200':
          $ref: '#/components/responses/DataResult200'
      tags: ["Visa"]
      
  /oecci/expert/visa-quota-exts:
    post:
      description: Permet de demander l'extension du nombre de visa pouvant etre sign� par un expert
      operationId: createDemandeExtensionQuotaVisa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDmdExtQuotVisaRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/CreateDmdExtQuotVisaRequest'
      responses:
        '201':
          description: Demande cree avec succes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataResult"
            application/xml:
              schema:
                $ref: "#/components/schemas/DataResult"
      tags: [ "Visa" ]

  /oecci/client/visa-quota-exts/validation/{demandeExtId}:
    post:
      summary: Valider/Invalider la demande d'extension de quota visa sign�
      operationId: validateDemandeExtQuotaVisa
      parameters:
        - name: demandeExtId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID de la demande d'extension
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatutRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/StatutRequest'
      responses:
        '201':
          description: Changement de statut effectue avec succes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataResult"
            application/xml:
              schema:
                $ref: "#/components/schemas/DataResult"
      tags: [ "Visa" ]
  
  /oecci/client-cga/canSignVisa/{expertId}:
    get:
      summary: Verifie quun expert comptable peut encore signer des visa
      operationId: canSignVisa
      parameters:
        - name: expertId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: L'ID de l'expert
      responses:
        '201':
          description: limite nombre visa verifie avec succes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataResult"
            application/xml:
              schema:
                $ref: "#/components/schemas/DataResult"
      tags: [ "Visa" ]


components:
  parameters:
    page:
      name: page
      in: query
      schema:
        type: integer
    pageSize:
      name: pageSize
      in: query
      schema:
        type: integer
    filter:
      name: filter
      in: query
      schema:
        type: string
    sort:
      name: sort
      in: query
      schema:
        type: string
    fields:
      name: fields
      in: query
      schema:
        type: string
    nestedFields:
      name: nestedFields
      in: query
      schema:
        type: string
    nestedFieldsDepth:
      name: nestedFieldsDepth
      in: query
      schema:
        type: integer

  responses:
    DataResult200:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DataResult'
    DataResult201:
      description: Cree avec succes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DataResult'

  schemas:
    CreateCollaboRequest:
      type: object
      properties:
        nom: {type: string}
        prenoms: {type: string}
        email: {type: string, format: email}
        contact: {type: string}
        role: {type: string, enum: [admin, moderateur, assistant]}
        statut: {type: boolean}
        creatorID: {type: integer, format: int64}
        creatorLevel: {type: string, enum: [admin, moderateur, assistant]}
      required: [nom, prenoms, email, role, statut]

    CreateExpertComptable:
      type: object
      properties:
        nom: {type: string}
        prenoms: {type: string}
        email: {type: string, format: email}
        adressePostale: {type: string}
        matricule: {type: string}
        annee_inscription: {type: string}
        contact: {type: string}
        inscription_by: {type: string, enum: [by_admin, by_moderateur, by_assistant]}
        inscription_type: {type: string, enum: [individuel, cabinet, collaborateur]}
        nomCabinet: {type: string}
        numeroCabinet: {type: string}
        inscription_mode: {type: string, enum: [for_assoc, for_coord, for_adj, for_na]}
        expertAssoID: {type: integer, format: int64}
      required: [nom, prenoms, email, matricule, inscription_type, inscription_mode]

    UpdateExpertRequest:
      type: object
      properties:
        nom: {type: string}
        prenoms: {type: string}
        email: {type: string, format: email}
        adressePostale: {type: string}
        matricule: {type: string}
        annee_inscription: {type: string}
        contact: {type: string}
        inscription_by: {type: string, enum: [by_admin, by_moderateur, by_assistant]}
        inscription_type: {type: string, enum: [individuel, cabinet, collaborateur]}
        nomCabinet: {type: string}
        numeroCabinet: {type: string}
        inscription_mode: {type: string, enum: [for_assoc, for_coord, for_adj, for_na]}
        expertAssoID: {type: integer, format: int64}
      required: [nom, prenoms, email, matricule, inscription_type, inscription_mode]

    CreateForwardRequest:
      type: object
      properties:
        clientID: {type: integer, format: int64}
        expertExpediteurID: {type: integer, format: int64}
        expertDestinataireID: {type: integer, format: int64}
        motif: {type: string}
      required: [expertExpediteurID, expertDestinataireID]

    StatutRequest:
      type: object
      properties:
        motif_refus: {type: string}
        statut: {$ref: '#/components/schemas/Option'}
      required: [statut]

    Option:
      type: object
      properties:
        key: {type: string}
        name: {type: string}
      required: [key, name]

    ReloadWalletRequest:
      type: object
      properties:
        walletID: {type: integer, format: int64}
        Expert_ComptableID: {type: integer, format: int64}
        paymentID: {type: integer, format: int64}
        amount: {type: integer, format: int64}
      required: [Expert_ComptableID, walletID, paymentID, amount]

    LoadVisualRequest:
      type: object
      properties:
        visualName: {type: string}
        visualContent: {type: string}
      required: [visualName, visualContent]

    DataResult:
      type: object
      properties:
        designation: {type: string}
        
    CreateDmdExtQuotVisaRequest:
      type: object
      properties:
        expertID:
          type: integer
          format: int64
        ordreExpertID:
          type: integer
          format: int64
        motif:
          type: string
      required:
        - expertID
        - cgaExpediteurID
        - ordreExpertID
