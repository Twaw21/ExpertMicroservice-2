openapi: 3.0.1
info:
  title: ExpertMicroservice
  version: v1.0
  description: ExpertMicroservice REST API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html

paths:

  # ===========================================================================
  #  COLLABORATEUR
  # ===========================================================================

  /oecci/expert/collaborateurs:
    post:
      operationId: createCollabos
      description: Permet d'ajouter un nouveau collaborateur avec ses informations personnelles, son role et son statut.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollaboRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/CreateCollaboRequest'
      responses:
        '201':
          $ref: '#/components/responses/DataResult201'
      tags: ["Collaborateur"]

  /oecci/expert/collaborateurs/update/{collaborateurId}:
    post:
      operationId: updateCollabo
      description: Permet de mettre a jour un collaborateur.
      parameters:
        - name: collaborateurId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCollaboRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/UpdateCollaboRequest'
      responses:
        '201':
          $ref: '#/components/responses/DataResult201'
      tags: ["Collaborateur"]

  /oecci/expert/collaborateurs/get:
    get:
      operationId: getCollaborateurs
      description: Liste complete des collaborateurs.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/nestedFields'
        - $ref: '#/components/parameters/nestedFieldsDepth'
      responses:
        '200':
          $ref: '#/components/responses/DataResult200'
      tags: ["Collaborateur"]

  /oecci/expert/collaborateurs/readallby/{collaboID}:
    get:
      operationId: getAllCollabos
      description: Recuperer la liste des collaborateurs pour un collaborateur
      parameters:
        - name: collaboID
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/nestedFields'
        - $ref: '#/components/parameters/nestedFieldsDepth'
      responses:
        '200':
          $ref: '#/components/responses/DataResult200'
      tags: ["Collaborateur"]

  /oecci/expert/collaborateurs/by-user/{liferayUserId}:
    get:
      operationId: getCollaborateurByUser
      description: Collaborateur par utilisateur Liferay
      parameters:
        - name: liferayUserId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/nestedFields'
        - $ref: '#/components/parameters/nestedFieldsDepth'
      responses:
        '200':
          $ref: '#/components/responses/DataResult200'
      tags: ["Collaborateur"]

  # ===========================================================================
  #  EXPERT COMPTABLE
  # ===========================================================================

  /oecci/expert/experts-comptables:
    post:
      operationId: createExpertComptable
      description: Permet de creer un expert comptable independant, sans rattachement a un cabinet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpertComptable'
          application/xml:
            schema:
              $ref: '#/components/schemas/CreateExpertComptable'
      responses:
        '201':
          $ref: '#/components/responses/DataResult201'
      tags: ["Expert_Comptable"]

  /oecci/expert/experts-comptables/update/{expertComptableId}:
    post:
      operationId: updateExpertComptable
      description: Mettre a jour les infos d'un expert comptable
      parameters:
        - name: expertComptableId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExpertRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/UpdateExpertRequest'
      responses:
        '201':
          $ref: '#/components/responses/DataResult201'
      tags: ["Expert_Comptable"]

  /oecci/expert/cabinet/update/{cabinetId}:
    post:
      operationId: updateCabinet
      description: Mettre a jour les infos d'un cabinet
      parameters:
        - name: cabinetId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCabinetRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/UpdateCabinetRequest'
      responses:
        '201':
          $ref: '#/components/responses/DataResult201'
      tags: ["Expert_Comptable"]

  /oecci/expert/experts-comptables/validation/{expertComptableId}:
    post:
      operationId: validateExpertComptable
      description: Valider ou invalider l'inscription d'un expert comptable
      parameters:
        - name: expertComptableId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatutRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/StatutRequest'
      responses:
        '201':
          $ref: '#/components/responses/DataResult201'
      tags: ["Expert_Comptable"]

  /oecci/expert/experts-comptables/load-visual/{expertComptableId}:
    post:
      operationId: loadSignVisual
      description: Charger le visuel de signature d'un expert comptable
      parameters:
        - name: expertComptableId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadVisualRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/LoadVisualRequest'
      responses:
        '201':
          $ref: '#/components/responses/DataResult201'
      tags: ["Expert_Comptable"]

  /oecci/expert/experts-comptables/{expertComptableId}:
    get:
      operationId: getExpertComptableById
      description: Expert comptable par ID
      parameters:
        - name: expertComptableId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/nestedFields'
        - $ref: '#/components/parameters/nestedFieldsDepth'
      responses:
        '200':
          $ref: '#/components/responses/DataResult200'
      tags: ["Expert_Comptable"]

  /oecci/expert/by-categorie:
    get:
      operationId: getExpertComptablesByCategorie
      description: Experts comptables par categorie et/ou etat
      parameters:
        - name: categorie
          in: query
          schema:
            type: string
            enum: [cabinet, individuel]
        - name: etat
          in: query
          schema:
            type: string
            enum: [aTRAITER, sUSPENDU, ACTIF]
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/nestedFields'
        - $ref: '#/components/parameters/nestedFieldsDepth'
      responses:
        '201':
          $ref: '#/components/responses/DataResult201'
      tags: ["Expert_Comptable"]

  /oecci/expert:
    get:
      operationId: getExpertComptables
      description: Experts comptables - endpoint generique
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/nestedFields'
        - $ref: '#/components/parameters/nestedFieldsDepth'
      responses:
        '200':
          $ref: '#/components/responses/DataResult200'
      tags: ["Expert_Comptable"]

  /oecci/expert/wallet/reload:
    post:
      operationId: reloadWallet
      description: Permet de recharger le wallet d'un expert comptable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReloadWalletRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/ReloadWalletRequest'
      responses:
        '201':
          $ref: '#/components/responses/DataResult201'
      tags: ["Expert_Comptable"]

  # ===========================================================================
  #  TRANSFERT CLIENT
  # ===========================================================================

  /oecci/expert/transfert-client:
    post:
      operationId: createTransfertClient
      description: Permet de transferer un client d'un expert comptable a un autre.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateForwardRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/CreateForwardRequest'
      responses:
        '201':
          $ref: '#/components/responses/DataResult201'
      tags: ["Transfert_Client"]

  /oecci/expert/transfert-client/validation/{demandeTransfertID}:
    post:
      operationId: validateDemandeTransfertClient
      description: Valider ou invalider la demande de transfert d'un client
      parameters:
        - name: demandeTransfertID
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatutRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/StatutRequest'
      responses:
        '201':
          $ref: '#/components/responses/DataResult201'
      tags: ["Transfert_Client"]

  /oecci/expert/transfert-client/by-destinataire/{expertComptableId}:
    get:
      operationId: getDemandesTransfertByDestinataire
      description: Demandes de transfert par expert destinataire
      parameters:
        - name: expertComptableId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/nestedFields'
        - $ref: '#/components/parameters/nestedFieldsDepth'
      responses:
        '200':
          $ref: '#/components/responses/DataResult200'
      tags: ["Transfert_Client"]

  /oecci/expert/transfert-client/by-expediteur/{expertComptableId}:
    get:
      operationId: getDemandesTransfertByExpediteur
      description: Demandes de transfert par expert expediteur
      parameters:
        - name: expertComptableId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/nestedFields'
        - $ref: '#/components/parameters/nestedFieldsDepth'
      responses:
        '200':
          $ref: '#/components/responses/DataResult200'
      tags: ["Transfert_Client"]

  /oecci/expert/transfert-client/list:
    get:
      operationId: getDemandesTransfertClients
      description: Demandes de transfert - endpoint generique
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/nestedFields'
        - $ref: '#/components/parameters/nestedFieldsDepth'
      responses:
        '200':
          $ref: '#/components/responses/DataResult200'
      tags: ["Transfert_Client"]

  # ===========================================================================
  #  VISA
  # ===========================================================================

  /oecci/expert/demande-visas/by-date:
    get:
      operationId: getDemandeVisasByDate
      description: Demandes de visa par plage de dates
      parameters:
        - name: dateDebut
          in: query
          schema:
            type: string
        - name: dateFin
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/nestedFields'
        - $ref: '#/components/parameters/nestedFieldsDepth'
      responses:
        '200':
          $ref: '#/components/responses/DataResult200'
      tags: ["Visa"]

  /oecci/expert/demande-visas/by-expert/{expertId}:
    get:
      operationId: getDemandeVisasByExpert
      description: Demandes de visa par expert comptable
      parameters:
        - name: expertId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/nestedFields'
        - $ref: '#/components/parameters/nestedFieldsDepth'
      responses:
        '200':
          $ref: '#/components/responses/DataResult200'
      tags: ["Visa"]

  /oecci/expert/demande-visas:
    get:
      operationId: getDemandeVisas
      description: Demandes de visa - endpoint generique
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/nestedFields'
        - $ref: '#/components/parameters/nestedFieldsDepth'
      responses:
        '200':
          $ref: '#/components/responses/DataResult200'
      tags: ["Visa"]

  /oecci/expert/visa-quota-exts:
    post:
      operationId: createDemandeExtensionQuotaVisa
      description: Permet de demander l'extension du nombre de visa pouvant etre signe par un expert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDmdExtQuotVisaRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/CreateDmdExtQuotVisaRequest'
      responses:
        '201':
          $ref: '#/components/responses/DataResult201'
      tags: ["Visa"]

  /oecci/expert/visa-quota-exts/demandes-extension-quota-visa:
    get:
      operationId: getDemandesExtensionQuotaVisa
      description: >
        Retourne la liste paginee des demandes d'extension de quota visa
        adressees a un administrateur de l'ordre donne.
        Chaque entree est enrichie avec les donnees de l'expert demandeur
        et le compteur de visas courant. Un bloc statusCounts est retourne
        pour le tableau de bord de l'administrateur.
      parameters:
        - name: ordreExpertId
          in: query
          required: true
          description: Identifiant (objectEntryId) de l'administrateur de l'ordre
          schema:
            type: integer
            format: int64
        - name: statut
          in: query
          required: false
          description: Filtre optionnel sur le statut. Valeurs possibles [eNCOURS, aCCEPTE, rEFUSE].
          schema:
            type: string
            enum: [eNCOURS, aCCEPTE, rEFUSE]
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '201':
          $ref: '#/components/responses/DataResult201'
      tags: ["Visa"]

  /oecci/expert/visa-quota-exts/validation/{demandeExtId}:
    post:
      operationId: validateDemandeExtQuotaVisa
      description: Valider ou invalider la demande d'extension de quota visa signe
      parameters:
        - name: demandeExtId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatutRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/StatutRequest'
      responses:
        '201':
          $ref: '#/components/responses/DataResult201'
      tags: ["Visa"]

  /oecci/expert/canSignVisa/{expertId}:
    get:
      operationId: canSignVisa
      description: Verifie qu'un expert comptable peut encore signer des visa
      parameters:
        - name: expertId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          $ref: '#/components/responses/DataResult200'
      tags: ["Visa"]

  # ===========================================================================
  #  RECOUVREMENT VEP
  # ===========================================================================

  /oecci/expert/recouvrement/stats:
    get:
      operationId: getRecouvrementStats
      description: >
        Cards d'accueil du module recouvrement.
        Retourne les 4 indicateurs clés :
        montantARestituer (somme des lignes isRecouvre=false),
        expertsCrediteurs (nombre d'experts avec une ligne ouverte),
        visasVepSignes (nombre de visas VEP au statut VISE),
        clientsConcernes (nombre de clients VEP distincts avec visa VISE).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecouvrementStatsResult'
      tags: ["Recouvrement"]

  /oecci/expert/recouvrement/stats/global:
    get:
      operationId: getRecouvrementStatsGlobal
      description: >
        Lecture comparative et badges d'exclusion (capture 2 du module recouvrement).
        Retourne :
        - lectureComparative : total paiements VEP, montant retenu (VISE + paiement SUCCESS),
          montant exclu du recouvrement.
        - statutsVisaExclus : compteurs par statut visa exclu (attenteVisa, valide, aModifier).
        - paiementsNonFinalises : compteurs processing / initiated.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecouvrementStatsGlobalResult'
      tags: ["Recouvrement"]

  /oecci/expert/recouvrement/by-expert:
    get:
      operationId: getRecouvrementByExpert
      description: >
        Tableau récapitulatif des remboursements à effectuer, groupé par expert comptable.
        Chaque ligne inclut : expertLabel, paiementsVep, clientsConcernes,
        montantARestituer, dernierVisaSigne, isRecouvre (badge front),
        recouvrementId (ID de la ligne active à valider).
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 10
            maximum: 100
        - name: expertFilter
          in: query
          required: false
          description: Filtre texte libre sur le nom ou le cabinet de l'expert
          schema:
            type: string
        - name: periodeDebut
          in: query
          required: false
          description: Debut de periode ISO 8601 (ex. 2025-01-01)
          schema:
            type: string
        - name: periodeFin
          in: query
          required: false
          description: Fin de periode ISO 8601 (ex. 2025-12-31)
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecouvrementByExpertResult'
      tags: ["Recouvrement"]

  /oecci/expert/recouvrement/{recouvrementId}:
    get:
      operationId: getRecouvrementDetail
      description: >
        Detail complet d'une ligne de recouvrement (panneau lateral capture 3).
        Retourne : resume de l'expert (nom, cabinet, paiementsVep, clients),
        montantARestituer, dernierVisaSigne, dossiersConcernes,
        isRecouvre, docPreuve, preuve,
        et la liste paginee des visas VEP VISE avec numeroDemande, client,
        paiementStatut, montantTTC et date.
      parameters:
        - name: recouvrementId
          in: path
          required: true
          description: ID de la ligne de recouvrement
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecouvrementDetailResult'
      tags: ["Recouvrement"]

  /oecci/expert/recouvrement/{recouvrementId}/valider:
    post:
      operationId: updateRecouvrement
      description: >
        Valide un recouvrement : passe isRecouvre a true, upload la preuve de
        remboursement physique (base64) dans Documents et Medias, stocke le
        fileEntryId dans docPreuve. Le remboursement physique s'effectue
        hors systeme ; cet endpoint en enregistre uniquement la preuve.
      parameters:
        - name: recouvrementId
          in: path
          required: true
          description: ID de la ligne de recouvrement a valider
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecouvrementRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/UpdateRecouvrementRequest'
      responses:
        '200':
          $ref: '#/components/responses/DataResult200'
      tags: ["Recouvrement"]


# =============================================================================
#  COMPONENTS
# =============================================================================

components:

  parameters:
    page:
      name: page
      in: query
      schema:
        type: integer
    pageSize:
      name: pageSize
      in: query
      schema:
        type: integer
    filter:
      name: filter
      in: query
      schema:
        type: string
    sort:
      name: sort
      in: query
      schema:
        type: string
    fields:
      name: fields
      in: query
      schema:
        type: string
    nestedFields:
      name: nestedFields
      in: query
      schema:
        type: string
    nestedFieldsDepth:
      name: nestedFieldsDepth
      in: query
      schema:
        type: integer

  responses:
    DataResult200:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DataResult'
    DataResult201:
      description: Cree avec succes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DataResult'

  schemas:

    # ── Collaborateur ─────────────────────────────────────────────────────────

    CreateCollaboRequest:
      type: object
      properties:
        nom: {type: string}
        prenoms: {type: string}
        email: {type: string, format: email}
        contact: {type: string}
        role:
          type: string
          enum: [admin, moderateur, assistant]
        statut: {type: boolean}
        creatorID: {type: integer, format: int64}
        creatorLevel:
          type: string
          enum: [admin, moderateur, assistant]
      required: [nom, prenoms, email, role, statut]

    UpdateCollaboRequest:
      type: object
      properties:
        nom: {type: string}
        prenoms: {type: string}
        contact: {type: string}
        statut: {type: boolean}
      required: [nom, prenoms, statut]

    # ── Expert comptable ──────────────────────────────────────────────────────

    CreateExpertComptable:
      type: object
      properties:
        nom: {type: string}
        prenoms: {type: string}
        email: {type: string, format: email}
        adressePostale: {type: string}
        matricule: {type: string}
        annee_inscription: {type: string}
        contact: {type: string}
        inscription_by:
          type: string
          enum: [by_admin, by_moderateur, by_assistant]
        inscription_type:
          type: string
          enum: [individuel, cabinet, collaborateur]
        nomCabinet: {type: string}
        numeroCabinet: {type: string}
        inscription_mode:
          type: string
          enum: [for_assoc, for_coord, for_adj, for_na]
        expertAssoID: {type: integer, format: int64}
      required: [nom, prenoms, email, matricule, inscription_type, inscription_mode]

    UpdateExpertRequest:
      type: object
      properties:
        nom: {type: string}
        prenoms: {type: string}
        adressePostale: {type: string}
        matricule: {type: string}
        annee_inscription: {type: integer, format: int64}
        contact: {type: string}
      required: [nom, prenoms, adressePostale, matricule, annee_inscription, contact]

    UpdateCabinetRequest:
      type: object
      properties:
        nom: {type: string}
        prenoms: {type: string}
        adressePostale: {type: string}
        matricule: {type: string}
        annee_inscription: {type: integer, format: int64}
        contact: {type: string}
        nomCabinet: {type: string}
        numeroCabinet: {type: string}
        categorie: {$ref: '#/components/schemas/Option'}
      required: [nom, prenoms, adressePostale, annee_inscription, matricule,
                 contact, nomCabinet, numeroCabinet, categorie]

    # ── Transfert client ──────────────────────────────────────────────────────

    CreateForwardRequest:
      type: object
      properties:
        clientID: {type: integer, format: int64}
        expertExpediteurID: {type: integer, format: int64}
        expertDestinataireID: {type: integer, format: int64}
        motif: {type: string}
      required: [expertExpediteurID, expertDestinataireID]

    # ── Visa ──────────────────────────────────────────────────────────────────

    CreateDmdExtQuotVisaRequest:
      type: object
      properties:
        expertID: {type: integer, format: int64}
        ordreExpertID: {type: integer, format: int64}
        motif: {type: string}
      required: [expertID, ordreExpertID]

    # ── Recouvrement ──────────────────────────────────────────────────────────

    UpdateRecouvrementRequest:
      type: object
      description: >
        Corps de la requete de validation d'un recouvrement.
        Le document est la preuve physique du remboursement encodée en base64.
      properties:
        document:
          $ref: '#/components/schemas/DocumentRequest'
      required: [document]

    DocumentRequest:
      type: object
      description: Document encodé en base64 pour upload dans Documents et Medias.
      properties:
        documentName:
          type: string
          description: Nom du fichier avec extension (ex. preuve_remboursement.pdf)
          example: preuve_remboursement_AKO_2025.pdf
        documentContent:
          type: string
          description: Contenu du fichier encodé en Base64 (sans prefixe data URI)
          example: JVBERi0xLjQK...
      required: [documentName, documentContent]

    # ── Réponses recouvrement (schémas de détail) ─────────────────────────────

    RecouvrementStatsResult:
      type: object
      description: Statistiques pour les cards d'accueil du module recouvrement.
      properties:
        code: {type: integer}
        message: {type: string}
        data:
          type: object
          properties:
            montantARestituer:
              type: integer
              format: int64
              description: Somme des montants des lignes de recouvrement non encore recouvrées (FCFA)
            expertsCrediteurs:
              type: integer
              description: Nombre d'experts ayant au moins une ligne de recouvrement ouverte
            visasVepSignes:
              type: integer
              description: Nombre de visas VEP au statut VISE
            clientsConcernes:
              type: integer
              description: Nombre de clients VEP distincts avec visa VISE

    RecouvrementStatsGlobalResult:
      type: object
      description: Lecture comparative et badges d'exclusion.
      properties:
        code: {type: integer}
        message: {type: string}
        data:
          type: object
          properties:
            lectureComparative:
              type: object
              properties:
                totalPaiementsVepMontant:
                  type: integer
                  format: int64
                  description: Somme TTC de tous les visas VEP avec paiement SUCCESS
                totalPaiementsVepCount:
                  type: integer
                  description: Nombre de dossiers VEP avec paiement positif
                retenuMontant:
                  type: integer
                  format: int64
                  description: Somme TTC des visas VEP VISE retenus pour restitution
                retenuCount:
                  type: integer
                  description: Nombre de dossiers VEP VISE avec paiement valide
                excluMontant:
                  type: integer
                  format: int64
                  description: Montant exclu du recouvrement (total - retenu)
                excluCount:
                  type: integer
                  description: Nombre de dossiers exclus
            statutsVisaExclus:
              type: object
              properties:
                attenteVisa: {type: integer}
                valide: {type: integer}
                aModifier: {type: integer}
            paiementsNonFinalises:
              type: object
              properties:
                processing: {type: integer}
                initiated: {type: integer}

    RecouvrementByExpertResult:
      type: object
      description: Tableau recapitulatif des recouvrements par expert.
      properties:
        code: {type: integer}
        message: {type: string}
        total: {type: integer}
        data:
          type: array
          items:
            type: object
            properties:
              expertComptableId:
                type: integer
                format: int64
              expertLabel:
                type: string
                description: Nom du cabinet ou prenom + nom de l'expert
              paiementsVep:
                type: integer
                description: Nombre de visas VEP VISE pour cet expert
              clientsConcernes:
                type: integer
                description: Nombre de clients VEP distincts
              montantARestituer:
                type: integer
                format: int64
                description: Total des montants de toutes les lignes de recouvrement de l'expert (FCFA)
              dernierVisaSigne:
                type: string
                description: Date du dernier visa VEP signe (ISO 8601)
              isRecouvre:
                type: boolean
                description: >
                  true si toutes les lignes de recouvrement de l'expert sont recouvrées.
                  false si au moins une ligne est encore ouverte.
                  Utilisé par le front pour afficher le badge de statut.
              recouvrementId:
                type: integer
                format: int64
                description: ID de la ligne de recouvrement active (-1 si toutes recouvrées)

    RecouvrementDetailResult:
      type: object
      description: Detail complet d'une ligne de recouvrement.
      properties:
        code: {type: integer}
        message: {type: string}
        data:
          type: object
          properties:
            id:
              type: integer
              format: int64
            montant:
              type: integer
              format: int64
              description: Montant total a restituer pour cette ligne (FCFA)
            isRecouvre:
              type: boolean
            docPreuve:
              type: integer
              format: int64
              description: fileEntryId du document de preuve dans Documents et Medias (0 si absent)
            preuve:
              type: string
              description: JSON serialise contenant fileEntryId et fileName de la preuve
            dateCreated: {type: string}
            dateModified: {type: string}
            expert:
              type: object
              properties:
                expertComptableId: {type: integer, format: int64}
                expertLabel: {type: string}
                paiementsVep: {type: integer}
                clients: {type: integer}
            dernierVisaSigne: {type: string}
            visas:
              type: array
              items:
                type: object
                properties:
                  numeroDemande: {type: string}
                  client: {type: string}
                  paiementStatut: {type: string}
                  visaStatut: {type: string}
                  montantTTC: {type: integer, format: int64}
                  date: {type: string}

    # ── Commun ────────────────────────────────────────────────────────────────

    StatutRequest:
      type: object
      properties:
        motif_refus: {type: string}
        statut: {$ref: '#/components/schemas/Option'}
      required: [statut]

    Option:
      type: object
      properties:
        key: {type: string}
        name: {type: string}
      required: [key, name]

    ReloadWalletRequest:
      type: object
      properties:
        walletID: {type: integer, format: int64}
        expertComptableID: {type: integer, format: int64}
        paymentID: {type: integer, format: int64}
        amount: {type: integer, format: int64}
      required: [expertComptableID, walletID, paymentID, amount]

    LoadVisualRequest:
      type: object
      properties:
        visualName: {type: string}
        visualContent: {type: string}
      required: [visualName, visualContent]

    DataResult:
      type: object
      properties:
        code: {type: integer}
        message: {type: string}
        data: {}